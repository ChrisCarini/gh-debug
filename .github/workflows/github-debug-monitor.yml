name: Monitor github-debug.com

on:
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-snapshot:
    name: Check meaningful webpage diagnostics
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compare github-debug.com snapshot
        id: compare
        continue-on-error: true
        run: |
          python3 scripts/github_debug_snapshot.py \
            --live \
            --expected .github/github-debug-snapshot.json \
            --check > github-debug-snapshot-diff.txt

      - name: Open issue for meaningful changes
        if: steps.compare.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title='github-debug.com meaningful diagnostics changed'
          existing_issue=$(gh issue list \
            --state open \
            --search '"github-debug.com meaningful diagnostics changed" in:title' \
            --json number \
            --jq '.[0].number')

          if [ -n "$existing_issue" ]; then
            echo "Issue #$existing_issue already tracks the current github-debug.com snapshot drift."
            exit 0
          fi

          {
            echo 'The scheduled github-debug.com monitor detected meaningful changes in the webpage diagnostics inputs.'
            echo
            echo 'The diff below compares the checked-in snapshot with the current live webpage extraction. Review whether the gh-debug CLI extension needs matching updates.'
            echo
            echo '```diff'
            cat github-debug-snapshot-diff.txt
            echo '```'
          } > issue-body.md

          gh issue create --title "$title" --body-file issue-body.md
